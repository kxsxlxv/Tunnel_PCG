name: test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[test]' trimesh
      - name: Compile standalone entry points
        run: python -m py_compile examples/generate_stage8_tunnel.py scripts/blender_verify_stage8.py scripts/verify_stage8_stress.py scripts/verify_stage8_trimesh.py
      - name: Unit and regression tests
        run: pytest
      - name: Stage 8 stress verification
        run: python scripts/verify_stage8_stress.py
      - name: Stage 8 independent trimesh verification
        run: python scripts/verify_stage8_trimesh.py
