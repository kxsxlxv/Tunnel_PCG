[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moscow-metro-tunnel-pcg-reference"
version = "0.2.0"
description = "Reference geometry, geospatial alignment and validation utilities for Moscow Metro tunnel procedural generation"
requires-python = ">=3.10"

[project.optional-dependencies]
geo = [
  "pyproj>=3.6",
  "rasterio>=1.3",
  "shapely>=2.0",
  "numpy>=1.24",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tunnel_pcg_ref*"]
