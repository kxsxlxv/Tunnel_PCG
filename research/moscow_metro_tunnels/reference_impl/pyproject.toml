[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moscow-metro-tunnel-pcg-reference"
version = "0.1.0"
description = "Reference geometry and validation utilities for Moscow Metro tunnel procedural generation"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["tunnel_pcg_ref*"]
