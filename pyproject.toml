[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tunnel-pcg"
version = "0.9.0"
description = "Procedural segmental tunnel geometry and production tunnel geometry generation"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "manifold3d>=3.5.3,<4"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
