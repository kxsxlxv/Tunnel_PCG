name: test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[test]' trimesh
      - name: Compile standalone entry points
        run: >-
          python -m py_compile
          examples/generate_stage8_tunnel.py
          examples/generate_stage9_production_tunnel.py
          examples/generate_stage10_production_tunnel.py
          scripts/blender_verify_stage8.py
          scripts/blender_verify_stage9.py
          scripts/blender_verify_stage10.py
          scripts/verify_stage8_stress.py
          scripts/verify_stage8_trimesh.py
          scripts/verify_stage9_stress.py
          scripts/verify_stage9_trimesh.py
          scripts/audit_stage9_topology.py
          scripts/verify_stage10_1.py
          scripts/verify_stage10_2.py
          scripts/verify_stage10_3.py
      - name: Unit and regression tests
        run: pytest
      - name: Stage 10.1 CLI compatibility smoke
        run: >-
          python examples/generate_stage10_production_tunnel.py
          --domain-stage 10.1
          --rings 4
          --namespace stage10-1-ci
          --no-bolts
          --axis-noise-sigma 0
          --output /tmp/stage10_1_production_scene.json
      - name: Stage 10.2 CLI permanent-way smoke
        run: >-
          python examples/generate_stage10_production_tunnel.py
          --domain-stage 10.2
          --rings 4
          --namespace stage10-2-ci
          --no-bolts
          --axis-noise-sigma 0
          --output /tmp/stage10_2_production_scene.json
      - name: Stage 10.3 CLI contact-rail smoke
        run: >-
          python examples/generate_stage10_production_tunnel.py
          --rings 20
          --namespace stage10-3-ci
          --no-bolts
          --axis-noise-sigma 0
          --output /tmp/stage10_3_production_scene.json
      - name: Stage 8 stress verification
        run: python scripts/verify_stage8_stress.py
      - name: Stage 8 independent trimesh verification
        run: python scripts/verify_stage8_trimesh.py
      - name: Stage 9 topology audit
        run: python scripts/audit_stage9_topology.py
      - name: Stage 9 long-tunnel stress verification
        run: python scripts/verify_stage9_stress.py
      - name: Stage 9 independent production mesh verification
        run: python scripts/verify_stage9_trimesh.py
      - name: Stage 10.1 Moscow production verification
        run: python scripts/verify_stage10_1.py
      - name: Stage 10.2 permanent-way verification
        run: python scripts/verify_stage10_2.py
      - name: Stage 10.3 contact-rail verification
        run: python scripts/verify_stage10_3.py
